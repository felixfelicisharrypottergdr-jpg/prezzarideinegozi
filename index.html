<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prezzari dei Negozi</title>
<style>
body{margin:0;background:#171a1b;color:#f3e6c8;font-family:Georgia,serif}
header{text-align:center;padding:18px;font-size:32px;color:#e0bf74}
#app{max-width:1200px;margin:auto;padding:20px}
.box{background:#222;border:1px solid #8b6a35;border-radius:16px;padding:15px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:#292929;border:1px solid #8b6a35;border-radius:12px;padding:12px;text-align:center}
.card img{width:100%;height:130px;object-fit:contain}
input,select,button{background:#111;color:#f3e6c8;border:1px solid #8b6a35;border-radius:8px;padding:8px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>Prezzari dei Negozi</header>
<div id="app">
<div class="box">
<input id="ricerca" placeholder="Cerca oggetto">
<select id="negozi"><option value="">Tutti i negozi</option></select>
<button onclick="filtra()">Cerca</button>
</div>
<div class="box">
<h2>Vetrina Magica</h2>
<div id="griglia" class="grid"></div>
</div>
</div>

<script src="database_oggetti.js"></script>
<script>
let oggetti = window.catalogoOggetti || [];

function inizializza(){
 let lista=[...new Set(oggetti.flatMap(o=>(o.varianti||[]).map(v=>v.negozio)).filter(Boolean))].sort();
 negozi.innerHTML='<option value="">Tutti i negozi</option>'+lista.map(n=>`<option>${n}</option>`).join('');
 vetrina();
}

function card(o){
 return `<div class="card">
 ${o.immagine?`<img src="${o.immagine}">`:''}
 <h3>${o.nome||''}</h3>
 <p>${o.categoria||''}</p>
 </div>`;
}

function vetrina(){
 griglia.innerHTML=[...oggetti].sort(()=>Math.random()-0.5).slice(0,12).map(card).join('');
}

function filtra(){
 let q=ricerca.value.toLowerCase();
 let n=negozi.value;
 let r=oggetti.filter(o=>{
  let ok=!q || JSON.stringify(o).toLowerCase().includes(q);
  let ok2=!n || (o.varianti||[]).some(v=>v.negozio===n);
  return ok&&ok2;
 });
 griglia.innerHTML=r.map(card).join('');
}

inizializza();
</script>
</body>
</html>
